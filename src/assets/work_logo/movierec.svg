<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a071b" />
        <stop offset="100%" stop-color="#150f2e" />
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06b6d4" />
        <stop offset="100%" stop-color="#3b82f6" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="15" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
    <rect width="800" height="450" fill="url(#bgGrad)" />
    <!-- Grid overlay -->
    <g opacity="0.08" stroke="#ffffff" stroke-width="1">
      <line x1="0" y1="90" x2="800" y2="90" />
      <line x1="0" y1="180" x2="800" y2="180" />
      <line x1="0" y1="270" x2="800" y2="270" />
      <line x1="0" y1="360" x2="800" y2="360" />
      <line x1="160" y1="0" x2="160" y2="450" />
      <line x1="320" y1="0" x2="320" y2="450" />
      <line x1="480" y1="0" x2="480" y2="450" />
      <line x1="640" y1="0" x2="640" y2="450" />
    </g>
    <!-- Glow aura -->
    <circle cx="400" cy="225" r="180" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
    <!-- Browser window -->
    <rect x="50" y="35" width="700" height="380" rx="16" fill="#0f0c23" stroke="#2a224a" stroke-width="2" />
    <!-- Title bar -->
    <rect x="50" y="35" width="700" height="42" rx="16" fill="#171233" />
    <rect x="50" y="65" width="700" height="12" fill="#171233" />
    <circle cx="78" cy="56" r="6" fill="#ef4444" />
    <circle cx="98" cy="56" r="6" fill="#f59e0b" />
    <circle cx="118" cy="56" r="6" fill="#10b981" />
    <rect x="150" y="46" width="360" height="20" rx="6" fill="#0c091f" />
    <text x="165" y="60" fill="#94a3b8" font-family="monospace" font-size="11">movie-recommendation-system.streamlit.app</text>
    <rect x="620" y="46" width="110" height="20" rx="10" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1" />
    <text x="675" y="60" text-anchor="middle" fill="#06b6d4" font-family="system-ui, sans-serif" font-weight="700" font-size="10">ML &amp; STREAMLIT</text>
    
  <g transform="translate(90, 105)">
    <text x="0" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="34">Movie Recommender System</text>
    <text x="0" y="70" fill="#67e8f9" font-family="system-ui, sans-serif" font-weight="600" font-size="16">Content-Based Filtering • Cosine Similarity • Python &amp; Streamlit</text>
    <g transform="translate(0, 95)">
      <rect width="120" height="32" rx="8" fill="#1e1840" stroke="#06b6d4" stroke-width="1" />
      <text x="60" y="21" text-anchor="middle" fill="#a5f3fc" font-family="system-ui" font-size="13" font-weight="600">🤖 Scikit-learn</text>
      <rect x="130" width="125" height="32" rx="8" fill="#1e1840" stroke="#3b82f6" stroke-width="1" />
      <text x="192" y="21" text-anchor="middle" fill="#bae6fd" font-family="system-ui" font-size="13" font-weight="600">🐍 Python 3</text>
      <rect x="265" width="120" height="32" rx="8" fill="#1e1840" stroke="#f43f5e" stroke-width="1" />
      <text x="325" y="21" text-anchor="middle" fill="#fecdd3" font-family="system-ui" font-size="13" font-weight="600">🍿 Streamlit</text>
    </g>
    <!-- Movie Cards Mockup -->
    <g transform="translate(0, 145)">
      <rect width="620" height="135" rx="14" fill="#140f2e" stroke="#1e3a47" stroke-width="1.5" />
      <g transform="translate(25, 20)">
        <rect width="130" height="95" rx="10" fill="#0e2330" stroke="#06b6d4" />
        <text x="15" y="35" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">Inception</text>
        <text x="15" y="55" fill="#38bdf8" font-family="system-ui" font-size="11">Similarity: 98%</text>
        <text x="15" y="75" fill="#94a3b8" font-family="system-ui" font-size="10">Sci-Fi • Thriller</text>
      </g>
      <g transform="translate(170, 20)">
        <rect width="130" height="95" rx="10" fill="#0e2330" stroke="#06b6d4" />
        <text x="15" y="35" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">Interstellar</text>
        <text x="15" y="55" fill="#38bdf8" font-family="system-ui" font-size="11">Similarity: 95%</text>
        <text x="15" y="75" fill="#94a3b8" font-family="system-ui" font-size="10">Adventure • Drama</text>
      </g>
      <g transform="translate(315, 20)">
        <rect width="130" height="95" rx="10" fill="#0e2330" stroke="#06b6d4" />
        <text x="15" y="35" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">The Dark Knight</text>
        <text x="15" y="55" fill="#38bdf8" font-family="system-ui" font-size="11">Similarity: 92%</text>
        <text x="15" y="75" fill="#94a3b8" font-family="system-ui" font-size="10">Action • Crime</text>
      </g>
    </g>
  </g>
</svg>