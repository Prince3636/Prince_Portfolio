<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a071b" />
        <stop offset="100%" stop-color="#150f2e" />
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#a855f7" />
        <stop offset="100%" stop-color="#ec4899" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="15" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
    <rect width="800" height="450" fill="url(#bgGrad)" />
    <!-- Grid overlay -->
    <g opacity="0.08" stroke="#ffffff" stroke-width="1">
      <line x1="0" y1="90" x2="800" y2="90" />
      <line x1="0" y1="180" x2="800" y2="180" />
      <line x1="0" y1="270" x2="800" y2="270" />
      <line x1="0" y1="360" x2="800" y2="360" />
      <line x1="160" y1="0" x2="160" y2="450" />
      <line x1="320" y1="0" x2="320" y2="450" />
      <line x1="480" y1="0" x2="480" y2="450" />
      <line x1="640" y1="0" x2="640" y2="450" />
    </g>
    <!-- Glow aura -->
    <circle cx="400" cy="225" r="180" fill="#a855f7" opacity="0.12" filter="url(#glow)" />
    <!-- Browser window -->
    <rect x="50" y="35" width="700" height="380" rx="16" fill="#0f0c23" stroke="#2a224a" stroke-width="2" />
    <!-- Title bar -->
    <rect x="50" y="35" width="700" height="42" rx="16" fill="#171233" />
    <rect x="50" y="65" width="700" height="12" fill="#171233" />
    <circle cx="78" cy="56" r="6" fill="#ef4444" />
    <circle cx="98" cy="56" r="6" fill="#f59e0b" />
    <circle cx="118" cy="56" r="6" fill="#10b981" />
    <rect x="150" y="46" width="360" height="20" rx="6" fill="#0c091f" />
    <text x="165" y="60" fill="#94a3b8" font-family="monospace" font-size="11">bingo-royale-bay.vercel.app</text>
    <rect x="620" y="46" width="110" height="20" rx="10" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1" />
    <text x="675" y="60" text-anchor="middle" fill="#a855f7" font-family="system-ui, sans-serif" font-weight="700" font-size="10">MULTIPLAYER GAME</text>
    
  <g transform="translate(90, 105)">
    <text x="0" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="34">Bingo Royale Multiplayer</text>
    <text x="0" y="70" fill="#d8b4fe" font-family="system-ui, sans-serif" font-weight="600" font-size="16">Room-based Real-time Multiplayer Game • Vite &amp; TypeScript</text>
    <g transform="translate(0, 95)">
      <rect width="140" height="32" rx="8" fill="#1e1840" stroke="#a855f7" stroke-width="1" />
      <text x="70" y="21" text-anchor="middle" fill="#e9d5ff" font-family="system-ui" font-size="13" font-weight="600">🎮 Room Sync</text>
      <rect x="150" width="135" height="32" rx="8" fill="#1e1840" stroke="#ec4899" stroke-width="1" />
      <text x="217" y="21" text-anchor="middle" fill="#fbcfe8" font-family="system-ui" font-size="13" font-weight="600">🏆 Live Score</text>
      <rect x="295" width="130" height="32" rx="8" fill="#1e1840" stroke="#3b82f6" stroke-width="1" />
      <text x="360" y="21" text-anchor="middle" fill="#bae6fd" font-family="system-ui" font-size="13" font-weight="600">⚡ TypeScript</text>
    </g>
    <!-- Bingo Board Mockup -->
    <g transform="translate(0, 145)">
      <rect width="620" height="135" rx="14" fill="#140f2e" stroke="#3e2055" stroke-width="1.5" />
      <!-- Grid 5 numbers -->
      <g transform="translate(25, 20)">
        <rect width="50" height="42" rx="8" fill="#a855f7" />
        <text x="25" y="27" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-weight="800" font-size="18">07</text>
        <rect x="60" width="50" height="42" rx="8" fill="#241842" stroke="#6b21a8" />
        <text x="85" y="27" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="18">19</text>
        <rect x="120" width="50" height="42" rx="8" fill="#a855f7" />
        <text x="145" y="27" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-weight="800" font-size="18">24</text>
        <rect x="180" width="50" height="42" rx="8" fill="#241842" stroke="#6b21a8" />
        <text x="205" y="27" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="18">38</text>
        <rect x="240" width="50" height="42" rx="8" fill="#a855f7" />
        <text x="265" y="27" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-weight="800" font-size="18">52</text>
      </g>
      <text x="330" y="55" fill="#f43f5e" font-family="system-ui" font-weight="800" font-size="22">🎉 B - I - N - G - O !</text>
      <text x="330" y="85" fill="#94a3b8" font-family="system-ui" font-size="13">Room ID: #ROYALE-772 • 4 Players Connected</text>
    </g>
  </g>
</svg>