<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a071b" />
        <stop offset="100%" stop-color="#150f2e" />
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#eab308" />
        <stop offset="100%" stop-color="#f97316" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="15" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
    <rect width="800" height="450" fill="url(#bgGrad)" />
    <!-- Grid overlay -->
    <g opacity="0.08" stroke="#ffffff" stroke-width="1">
      <line x1="0" y1="90" x2="800" y2="90" />
      <line x1="0" y1="180" x2="800" y2="180" />
      <line x1="0" y1="270" x2="800" y2="270" />
      <line x1="0" y1="360" x2="800" y2="360" />
      <line x1="160" y1="0" x2="160" y2="450" />
      <line x1="320" y1="0" x2="320" y2="450" />
      <line x1="480" y1="0" x2="480" y2="450" />
      <line x1="640" y1="0" x2="640" y2="450" />
    </g>
    <!-- Glow aura -->
    <circle cx="400" cy="225" r="180" fill="#eab308" opacity="0.12" filter="url(#glow)" />
    <!-- Browser window -->
    <rect x="50" y="35" width="700" height="380" rx="16" fill="#0f0c23" stroke="#2a224a" stroke-width="2" />
    <!-- Title bar -->
    <rect x="50" y="35" width="700" height="42" rx="16" fill="#171233" />
    <rect x="50" y="65" width="700" height="12" fill="#171233" />
    <circle cx="78" cy="56" r="6" fill="#ef4444" />
    <circle cx="98" cy="56" r="6" fill="#f59e0b" />
    <circle cx="118" cy="56" r="6" fill="#10b981" />
    <rect x="150" y="46" width="360" height="20" rx="6" fill="#0c091f" />
    <text x="165" y="60" fill="#94a3b8" font-family="monospace" font-size="11">ganit-ghar.vercel.app</text>
    <rect x="620" y="46" width="110" height="20" rx="10" fill="#eab308" fill-opacity="0.2" stroke="#eab308" stroke-width="1" />
    <text x="675" y="60" text-anchor="middle" fill="#eab308" font-family="system-ui, sans-serif" font-weight="700" font-size="10">GAMIFIED EDTECH</text>
    
  <g transform="translate(90, 105)">
    <text x="0" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="34">Ganit-Ghar Math Learning</text>
    <text x="0" y="70" fill="#fde047" font-family="system-ui, sans-serif" font-weight="600" font-size="16">15 Core Math Topics • 10 Levels Each • Gamified Progression</text>
    <g transform="translate(0, 95)">
      <rect width="145" height="32" rx="8" fill="#1e1840" stroke="#eab308" stroke-width="1" />
      <text x="72" y="21" text-anchor="middle" fill="#fef08a" font-family="system-ui" font-size="13" font-weight="600">📐 15 Math Topics</text>
      <rect x="155" width="135" height="32" rx="8" fill="#1e1840" stroke="#f97316" stroke-width="1" />
      <text x="222" y="21" text-anchor="middle" fill="#fed7aa" font-family="system-ui" font-size="13" font-weight="600">🪜 10 Levels Each</text>
      <rect x="300" width="130" height="32" rx="8" fill="#1e1840" stroke="#10b981" stroke-width="1" />
      <text x="365" y="21" text-anchor="middle" fill="#a7f3d0" font-family="system-ui" font-size="13" font-weight="600">⭐ Interactive UI</text>
    </g>
    <!-- Levels ladder mockup -->
    <g transform="translate(0, 145)">
      <rect width="620" height="135" rx="14" fill="#140f2e" stroke="#483617" stroke-width="1.5" />
      <g transform="translate(30, 30)">
        <circle cx="25" cy="25" r="22" fill="#10b981" />
        <text x="25" y="32" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-weight="800" font-size="16">L1</text>
        <line x1="47" y1="25" x2="90" y2="25" stroke="#10b981" stroke-width="4" />
        <circle cx="115" cy="25" r="22" fill="#10b981" />
        <text x="115" y="32" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-weight="800" font-size="16">L2</text>
        <line x1="137" y1="25" x2="180" y2="25" stroke="#10b981" stroke-width="4" />
        <circle cx="205" cy="25" r="22" fill="#eab308" />
        <text x="205" y="32" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-weight="800" font-size="16">L3</text>
        <line x1="227" y1="25" x2="270" y2="25" stroke="#4b5563" stroke-width="4" />
        <circle cx="295" cy="25" r="22" fill="#374151" />
        <text x="295" y="32" text-anchor="middle" fill="#9ca3af" font-family="system-ui" font-weight="800" font-size="16">L4</text>
      </g>
      <text x="360" y="55" fill="#fde047" font-family="system-ui" font-weight="700" font-size="16">Topic: Algebra &amp; Equations</text>
      <text x="360" y="80" fill="#94a3b8" font-family="system-ui" font-size="13">Score: 2,450 XP • Level 3 Unlocked</text>
    </g>
  </g>
</svg>