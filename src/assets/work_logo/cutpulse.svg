<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a071b" />
        <stop offset="100%" stop-color="#150f2e" />
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ec4899" />
        <stop offset="100%" stop-color="#8b5cf6" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="15" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
    <rect width="800" height="450" fill="url(#bgGrad)" />
    <!-- Grid overlay -->
    <g opacity="0.08" stroke="#ffffff" stroke-width="1">
      <line x1="0" y1="90" x2="800" y2="90" />
      <line x1="0" y1="180" x2="800" y2="180" />
      <line x1="0" y1="270" x2="800" y2="270" />
      <line x1="0" y1="360" x2="800" y2="360" />
      <line x1="160" y1="0" x2="160" y2="450" />
      <line x1="320" y1="0" x2="320" y2="450" />
      <line x1="480" y1="0" x2="480" y2="450" />
      <line x1="640" y1="0" x2="640" y2="450" />
    </g>
    <!-- Glow aura -->
    <circle cx="400" cy="225" r="180" fill="#ec4899" opacity="0.12" filter="url(#glow)" />
    <!-- Browser window -->
    <rect x="50" y="35" width="700" height="380" rx="16" fill="#0f0c23" stroke="#2a224a" stroke-width="2" />
    <!-- Title bar -->
    <rect x="50" y="35" width="700" height="42" rx="16" fill="#171233" />
    <rect x="50" y="65" width="700" height="12" fill="#171233" />
    <circle cx="78" cy="56" r="6" fill="#ef4444" />
    <circle cx="98" cy="56" r="6" fill="#f59e0b" />
    <circle cx="118" cy="56" r="6" fill="#10b981" />
    <rect x="150" y="46" width="360" height="20" rx="6" fill="#0c091f" />
    <text x="165" y="60" fill="#94a3b8" font-family="monospace" font-size="11">cutpulse-eight.vercel.app</text>
    <rect x="620" y="46" width="110" height="20" rx="10" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1" />
    <text x="675" y="60" text-anchor="middle" fill="#ec4899" font-family="system-ui, sans-serif" font-weight="700" font-size="10">WASM POWERED</text>
    
  <g transform="translate(90, 105)">
    <text x="0" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="34">CutPulse Video Splitter</text>
    <text x="0" y="70" fill="#f472b6" font-family="system-ui, sans-serif" font-weight="600" font-size="16">WebAssembly (FFmpeg WASM) • 100% Client-Side</text>
    <g transform="translate(0, 95)">
      <rect width="140" height="32" rx="8" fill="#1e1840" stroke="#ec4899" stroke-width="1" />
      <text x="70" y="21" text-anchor="middle" fill="#fbcfe8" font-family="system-ui" font-size="13" font-weight="600">🛡️ Zero Uploads</text>
      <rect x="150" width="140" height="32" rx="8" fill="#1e1840" stroke="#a855f7" stroke-width="1" />
      <text x="220" y="21" text-anchor="middle" fill="#e9d5ff" font-family="system-ui" font-size="13" font-weight="600">⚡ Original Stream</text>
      <rect x="300" width="130" height="32" rx="8" fill="#1e1840" stroke="#38bdf8" stroke-width="1" />
      <text x="365" y="21" text-anchor="middle" fill="#bae6fd" font-family="system-ui" font-size="13" font-weight="600">✨ Zero Watermark</text>
    </g>
    <!-- Video timeline player mockup -->
    <g transform="translate(0, 145)">
      <rect width="620" height="135" rx="14" fill="#140f2e" stroke="#3d2260" stroke-width="1.5" />
      <!-- Timeline tracks -->
      <rect x="25" y="25" width="570" height="45" rx="8" fill="#1c163b" />
      <!-- Video chapters -->
      <rect x="30" y="30" width="170" height="35" rx="6" fill="#8b5cf6" fill-opacity="0.6" stroke="#c084fc" />
      <text x="115" y="52" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-size="12">Part 1 (00:30)</text>
      <rect x="205" y="30" width="170" height="35" rx="6" fill="#ec4899" fill-opacity="0.6" stroke="#f472b6" />
      <text x="290" y="52" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-size="12">Part 2 (00:30)</text>
      <rect x="380" y="30" width="170" height="35" rx="6" fill="#3b82f6" fill-opacity="0.6" stroke="#60a5fa" />
      <text x="465" y="52" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-size="12">Part 3 (00:30)</text>
      <!-- Timeline scrubber -->
      <line x1="280" y1="20" x2="280" y2="75" stroke="#ffffff" stroke-width="3" />
      <circle cx="280" cy="20" r="6" fill="#ffffff" />
      <!-- Export buttons -->
      <rect x="25" y="85" width="160" height="34" rx="8" fill="url(#accentGrad)" />
      <text x="105" y="107" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">Export Status Clips</text>
      <text x="220" y="107" fill="#a78bfa" font-family="system-ui" font-size="13">Speed: 4.8x • FFmpeg Native Stream</text>
    </g>
  </g>
</svg>