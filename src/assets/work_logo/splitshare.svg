<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a071b" />
        <stop offset="100%" stop-color="#150f2e" />
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8b5cf6" />
        <stop offset="100%" stop-color="#06b6d4" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="15" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
    <rect width="800" height="450" fill="url(#bgGrad)" />
    <!-- Grid overlay -->
    <g opacity="0.08" stroke="#ffffff" stroke-width="1">
      <line x1="0" y1="90" x2="800" y2="90" />
      <line x1="0" y1="180" x2="800" y2="180" />
      <line x1="0" y1="270" x2="800" y2="270" />
      <line x1="0" y1="360" x2="800" y2="360" />
      <line x1="160" y1="0" x2="160" y2="450" />
      <line x1="320" y1="0" x2="320" y2="450" />
      <line x1="480" y1="0" x2="480" y2="450" />
      <line x1="640" y1="0" x2="640" y2="450" />
    </g>
    <!-- Glow aura -->
    <circle cx="400" cy="225" r="180" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" />
    <!-- Browser window -->
    <rect x="50" y="35" width="700" height="380" rx="16" fill="#0f0c23" stroke="#2a224a" stroke-width="2" />
    <!-- Title bar -->
    <rect x="50" y="35" width="700" height="42" rx="16" fill="#171233" />
    <rect x="50" y="65" width="700" height="12" fill="#171233" />
    <circle cx="78" cy="56" r="6" fill="#ef4444" />
    <circle cx="98" cy="56" r="6" fill="#f59e0b" />
    <circle cx="118" cy="56" r="6" fill="#10b981" />
    <rect x="150" y="46" width="360" height="20" rx="6" fill="#0c091f" />
    <text x="165" y="60" fill="#94a3b8" font-family="monospace" font-size="11">split-share-puce.vercel.app</text>
    <rect x="620" y="46" width="110" height="20" rx="10" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1" />
    <text x="675" y="60" text-anchor="middle" fill="#8b5cf6" font-family="system-ui, sans-serif" font-weight="700" font-size="10">LIVE APP</text>
    
  <g transform="translate(90, 105)">
    <!-- Left Hero details -->
    <text x="0" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="34">Splitshare-Pro</text>
    <text x="0" y="70" fill="#a78bfa" font-family="system-ui, sans-serif" font-weight="600" font-size="16">Mobile-First Bill Splitting &amp; UPI Settlements</text>
    <g transform="translate(0, 95)">
      <rect width="125" height="32" rx="8" fill="#1e1840" stroke="#8b5cf6" stroke-width="1" />
      <text x="62" y="21" text-anchor="middle" fill="#c4b5fd" font-family="system-ui" font-size="13" font-weight="600">⚡ Real-time</text>
      <rect x="135" width="120" height="32" rx="8" fill="#1e1840" stroke="#06b6d4" stroke-width="1" />
      <text x="195" y="21" text-anchor="middle" fill="#67e8f9" font-family="system-ui" font-size="13" font-weight="600">📱 Capacitor</text>
      <rect x="265" width="115" height="32" rx="8" fill="#1e1840" stroke="#10b981" stroke-width="1" />
      <text x="322" y="21" text-anchor="middle" fill="#6ee7b7" font-family="system-ui" font-size="13" font-weight="600">💸 Multi-UPI</text>
    </g>
    <!-- Expense breakdown card -->
    <g transform="translate(0, 150)">
      <rect width="380" height="120" rx="14" fill="#140f2e" stroke="#31265c" stroke-width="1.5" />
      <text x="20" y="32" fill="#94a3b8" font-family="system-ui" font-size="13">Manali Trip • Total Settled</text>
      <text x="20" y="68" fill="#ffffff" font-family="system-ui" font-weight="800" font-size="28">₹ 24,850.00</text>
      <rect x="20" y="86" width="340" height="8" rx="4" fill="#241b4d" />
      <rect x="20" y="86" width="280" height="8" rx="4" fill="url(#accentGrad)" />
      <text x="280" y="55" fill="#10b981" font-family="system-ui" font-weight="700" font-size="13">● 100% Settled</text>
    </g>
    <!-- Right Mockup Phone Preview -->
    <g transform="translate(430, 5)">
      <rect width="180" height="275" rx="24" fill="#1a1438" stroke="#8b5cf6" stroke-width="3" />
      <rect x="15" y="18" width="150" height="28" rx="8" fill="#2d225e" />
      <text x="90" y="37" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="700">QR UPI Settlement</text>
      <!-- QR Dummy Box -->
      <rect x="35" y="60" width="110" height="110" rx="12" fill="#ffffff" />
      <rect x="45" y="70" width="30" height="30" fill="#000000" />
      <rect x="105" y="70" width="30" height="30" fill="#000000" />
      <rect x="45" y="130" width="30" height="30" fill="#000000" />
      <rect x="85" y="110" width="20" height="20" fill="#000000" />
      <!-- Button -->
      <rect x="20" y="195" width="140" height="34" rx="10" fill="url(#accentGrad)" />
      <text x="90" y="217" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">Pay via UPI</text>
      <text x="90" y="250" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">WhatsApp Settlement</text>
    </g>
  </g>
</svg>